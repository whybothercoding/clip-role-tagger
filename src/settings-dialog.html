<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip Role Tagger — Roles</title>
  <script>
    const isWebKit = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live;
    const isWebView2 = window.chrome && window.chrome.webview;

    function sendMessage(message) {
      if (isWebKit) window.webkit.messageHandlers.live.postMessage(message);
      else if (isWebView2) window.chrome.webview.postMessage(message);
    }

    function closeWithResult(result) {
      sendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    *:not(dialog) { margin: 0; }
    input, button { font: inherit; }

    /*
     * The SDK's ExtensionContext.environment has no theme/brightness field
     * (checked the type declarations directly — only storageDirectory,
     * tempDirectory, language exist), so there's no signal from Live itself
     * to read here. This falls back to the OS-level prefers-color-scheme
     * media query, which is NOT the same thing as Live's own "Look"
     * brightness slider (a continuous preference, not a light/dark toggle)
     * — unverified whether Live's webview even forwards that slider's state
     * into this CSS feature at all. This follows the system appearance
     * setting; it may not track Live's internal theme precisely.
     */
    :root {
      /* Light (default) */
      --p-live-ui-bg: hsl(0, 0%, 88%);
      --p-live-control-bg: hsl(0, 0%, 80%);
      --p-live-input-bg: hsl(0, 0%, 97%);
      --p-live-text-primary: hsl(0, 0%, 13%);
      --p-live-control-border: hsl(0, 0%, 60%);
      --p-live-text-secondary: hsl(0, 0%, 38%);
      --p-live-accent-primary: hsl(31, 100%, 45%);
      --p-live-control-text--enabled: hsl(0, 0%, 100%);
      --p-live-danger: hsl(4, 70%, 42%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --p-live-ui-bg: hsl(0, 0%, 21%);
        --p-live-control-bg: hsl(0, 0%, 16%);
        --p-live-input-bg: hsl(0, 0%, 12%);
        --p-live-text-primary: hsl(0, 0%, 71%);
        --p-live-control-border: hsl(0, 0%, 7%);
        --p-live-text-secondary: hsl(0, 0%, 41%);
        --p-live-accent-primary: hsl(31, 100%, 67%);
        --p-live-control-text--enabled: hsl(0, 0%, 7%);
        --p-live-danger: hsl(4, 70%, 58%);
      }
    }

    :root {
      --c-bg: oklch(from var(--p-live-ui-bg) l c h);
      --c-text-primary: oklch(from var(--p-live-text-primary) l c h);
      --c-text-secondary: oklch(from var(--p-live-text-secondary) l c h);
      --c-control-bg: oklch(from var(--p-live-control-bg) l c h);
      --c-control-bg-hover: oklch(from var(--p-live-control-bg) calc(l * 1.15) c h);
      --c-control-border: oklch(from var(--p-live-control-border) l c h);
      --c-control-outline: var(--c-text-secondary);
      --c-input-bg: oklch(from var(--p-live-input-bg) l c h);
      --c-accent: oklch(from var(--p-live-accent-primary) l c h);
      --c-danger: oklch(from var(--p-live-danger) l c h);
    }

    html, body {
      height: 100%;
      background-color: var(--c-bg);
      color: var(--c-text-primary);
      font-family: "AbletonSansSmall", sans-serif;
      font-size: 11.5px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 1em 1.25em;
      gap: 0.75em;
    }

    h1 {
      font-size: 1.15em;
      font-weight: 600;
      color: var(--c-text-primary);
    }

    .hint {
      color: var(--c-text-secondary);
      font-size: 0.95em;
      line-height: 1.4;
    }

    #rows {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4em;
      padding: 0.25em;
      border: 1px solid var(--c-control-border);
      background: var(--c-input-bg);
      border-radius: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 28px 1fr 90px 24px;
      gap: 0.5em;
      align-items: center;
    }

    .color-swatch-btn {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--c-control-border);
      cursor: pointer;
      border-radius: 3px;
    }
    .color-swatch-btn:focus { outline: 2px solid var(--c-control-outline); outline-offset: 1px; }

    .color-picker-popup {
      position: fixed;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(8, 20px);
      gap: 4px;
      padding: 6px;
      background: var(--c-control-bg);
      border: 1px solid var(--c-control-border);
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .color-picker-popup.hidden { display: none; }

    .palette-swatch {
      width: 20px;
      height: 20px;
      padding: 0;
      border: 1px solid var(--c-control-border);
      border-radius: 3px;
      cursor: pointer;
    }
    .palette-swatch:hover { outline: 2px solid var(--c-control-outline); outline-offset: 1px; }

    .row input[type="text"] {
      background-color: var(--c-control-bg);
      color: var(--c-text-primary);
      border: 1px solid var(--c-control-border);
      height: 22px;
      padding: 0 0.5em;
      border-radius: 3px;
    }
    .row input[type="text"]::placeholder { color: var(--c-text-secondary); }
    .row input[type="text"]:focus {
      outline: 2px solid var(--c-control-outline);
      outline-offset: 0;
    }

    .row .tag-input { text-transform: uppercase; }

    .remove-btn {
      background: none;
      border: none;
      color: var(--c-text-secondary);
      cursor: pointer;
      font-size: 1.1em;
      line-height: 1;
      padding: 2px;
    }
    .remove-btn:hover { color: var(--c-danger); }

    .add-btn {
      align-self: flex-start;
      background: none;
      border: 1px dashed var(--c-control-border);
      color: var(--c-text-secondary);
      cursor: pointer;
      padding: 0.4em 0.8em;
      border-radius: 3px;
      font-size: 0.95em;
    }
    .add-btn:hover { color: var(--c-text-primary); border-color: var(--c-text-secondary); }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.5em;
    }

    .btn {
      background-color: var(--c-control-bg);
      color: var(--c-text-primary);
      border: 1px solid var(--c-control-border);
      height: 24px;
      padding: 0 1.2em;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn:hover { background-color: var(--c-control-bg-hover); }
    .btn.primary {
      background-color: var(--c-accent);
      color: var(--p-live-control-text--enabled);
      border-color: var(--c-accent);
      font-weight: 600;
    }
  </style>
</head>

<body>
  <h1>Clip Role Tagger — Roles</h1>
  <p class="hint">Each role becomes a "Tag as: …" entry in the clip and track right-click menus. Changes apply immediately — no need to restart Live.</p>

  <div id="rows"></div>
  <button class="add-btn" onclick="addRow()">+ Add role</button>

  <div class="buttons">
    <button class="btn" onclick="closeWithResult({ roles: null })">Cancel</button>
    <button class="btn primary" onclick="save()">Save</button>
  </div>

  <div id="color-picker-popup" class="color-picker-popup hidden"></div>

  <script>
    // Replaced with the current roles array (as JSON) before this HTML is
    // encoded into the data: URL — see extension.ts.
    const initialRoles = __INITIAL_ROLES__;

    // A plain <input type="color"> opens the OS-level color panel, which
    // fights the modal dialog for focus inside Live's embedded webview and
    // slams shut immediately. This palette stays entirely inside the
    // webview's own DOM, so there's no native window to lose focus to.
    const PALETTE = [
      '#FF764D', '#5AA9E6', '#F2E94E', '#9B5DE5', '#2EC4B6', '#FF5D8F',
      '#8AC926', '#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#F72585',
      '#4CC9F0', '#B5838D', '#FFFFFF', '#888888',
    ];

    const rowsEl = document.getElementById('rows');
    const popupEl = document.getElementById('color-picker-popup');
    let activeSwatchBtn = null;

    PALETTE.forEach((hex) => {
      const sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'palette-swatch';
      sw.style.backgroundColor = hex;
      sw.title = hex;
      sw.onclick = () => pickColor(hex);
      popupEl.appendChild(sw);
    });

    function openColorPicker(btn) {
      activeSwatchBtn = btn;
      const rect = btn.getBoundingClientRect();
      popupEl.style.top = `${rect.bottom + 4}px`;
      popupEl.style.left = `${rect.left}px`;
      popupEl.classList.remove('hidden');
    }

    function pickColor(hex) {
      if (activeSwatchBtn) {
        activeSwatchBtn.style.backgroundColor = hex;
        activeSwatchBtn.dataset.color = hex;
      }
      closeColorPicker();
    }

    function closeColorPicker() {
      popupEl.classList.add('hidden');
      activeSwatchBtn = null;
    }

    document.addEventListener('click', (e) => {
      if (popupEl.classList.contains('hidden')) return;
      if (popupEl.contains(e.target) || e.target.classList.contains('color-swatch-btn')) return;
      closeColorPicker();
    });

    function addRow(role) {
      const color = (role && role.color) || '#888888';
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <button type="button" class="color-swatch-btn" style="background-color: ${color}" data-color="${color}"></button>
        <input type="text" class="label-input" placeholder="Role name…" value="${role ? escapeAttr(role.label) : ''}">
        <input type="text" class="tag-input" placeholder="auto" maxlength="10" value="${role && role.tag ? escapeAttr(role.tag) : ''}">
        <button class="remove-btn" title="Remove" onclick="this.closest('.row').remove()">×</button>
      `;
      row.querySelector('.color-swatch-btn').addEventListener('click', (e) => openColorPicker(e.currentTarget));
      rowsEl.appendChild(row);
    }

    function escapeAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function save() {
      const roles = Array.from(rowsEl.querySelectorAll('.row')).map((row) => ({
        label: row.querySelector('.label-input').value.trim(),
        tag: row.querySelector('.tag-input').value.trim(),
        color: row.querySelector('.color-swatch-btn').dataset.color,
      })).filter((r) => r.label.length > 0);

      closeWithResult({ roles });
    }

    initialRoles.forEach(addRow);
    if (initialRoles.length === 0) addRow();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeWithResult({ roles: null });
    });
  </script>
</body>

</html>
